app:
  name: "Kitting Station"
  version: "2.0"
  host: "0.0.0.0"
  port: 7000
  debug: true

client:
  name: "Watts Water"
  brand: "Dormont"
  logo_path: "images/watts_logo.png"

developer:
  name: "AssertAI"

storage:
  pqpr_dir: "data/pqpr"
  pqpr_allowed_extensions: [".xlsx", ".xls"]
  max_upload_size_mb: 20
  audio_dir: "data/audio"
  audio_allowed_extensions: [".mp3"]

mongodb:
  db_name: "kitting_station_v2"
  collections:
    current_kits: "current_kit_configurations"
    table_configuration: "table_configuration"
    live_activities: "live_activity_details"
    activity_history: "activity_history"

pqpr_parsing:
  sheet_name: "PQPR - FG -- Copy"
  header_row: 1
  kit_name_column: "B"
  edp_column: "C"
  component_start_column: "H"
  top10_row_count: 10

# Tables (kitting stations/cells) this app can be configured for. table_id
# is the stable reference used throughout routes, MongoDB documents, and
# PQPR file storage - not hardcoded, so adding table 4/5 later is a config
# change, not a code change. `built` gates whether a table shows its real
# Current Kits/PQPR configuration or a "not yet built" placeholder.
configuration:
  tables:
    - id: 1
      name: "HVGKC-CELL"
      built: true
    - id: 2
      name: "Truck Cell 1"
      built: false
    - id: 3
      name: "Truck Cell 2"
      built: false

theme:
  default: "dark"
  cookie_name: "theme_preference"
  cookie_max_age_days: 365

features:
  live_kitting_activities: true
  history: true
  configuration: true

# Live detection ingest (CV-side, from the local DeepStream application).
# Detections are stored embedded on each live_activity_details document
# itself (part_counts_cam{1,2}, last_detected_cam{1,2}, detections -
# see app/blueprints/cv_ingest/detection_data.py) rather than a separate
# collection - one activity_id always returns the complete picture.
# green_popup_uptime_sec: how long a correct-part-detected pop-up stays
# on screen client-side (monitor.js reads this via a data-* attribute -
# never hardcode it in JS). detection_image_dir: filesystem root for
# saved detection frames, namespaced per table_id same as pqpr_dir/audio_dir.
live_kitting:
  green_popup_uptime_sec: 2
  red_popup_uptime_sec: 3
  detection_image_dir: "data/detections"
  allowed_image_extensions: [".jpg", ".jpeg", ".png"]
