{% extends "base.html" %}

{% block title %}Create Kitting Activity — {{ app_name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/live-activities.css') }}">
{% endblock %}

{% block content %}
<div class="activity-form-page"
     data-lookup-edp-url="{{ url_for('live_kitting_activities.lookup_edp') }}"
     data-check-busy-url="{{ url_for('live_kitting_activities.check_table_busy') }}"
     data-camera-check-url="{{ url_for('live_kitting_activities.camera_check') }}"
     data-cancel-url="{{ url_for('live_kitting_activities.index') }}">

  <h1>Start New Activity</h1>

  <p id="activity-form-error" class="form-error" hidden></p>

  <form id="activity-form" novalidate>
    <div class="form-field">
      <label for="table-select">Select Station</label>
      <select id="table-select" name="table_id" required>
        {% for table in tables %}
          <option value="{{ table.id }}">Table {{ table.id }} ({{ table.name }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-field">
      <label for="order-number">Order Number <span class="form-field__hint">(Scan or type, then Enter)</span></label>
      <input type="text" id="order-number" name="order_number" placeholder="Scan or type Order #" required autofocus>
    </div>

    <div class="form-field">
      <label for="edp-number">EDP Number <span class="form-field__hint">(Scan or type, then Enter)</span></label>
      <input type="text" id="edp-number" name="edp_number" placeholder="Scan EDP to fetch Kit Name" required>
    </div>

    <div class="form-field">
      <label for="kit-name">Kit Name <span class="form-field__hint">(Auto-filled)</span></label>
      <input type="text" id="kit-name" name="kit_name" placeholder="Will populate automatically..." readonly>
      <input type="hidden" id="kit-id" name="kit_id">
    </div>

    <div class="form-field">
      <label for="units-to-pack">Units to Pack</label>
      <input type="number" id="units-to-pack" name="quantity_required" min="1" step="1" value="{{ default_units_to_pack }}" required>
    </div>

    <div class="activity-form__actions">
      <a href="{{ url_for('live_kitting_activities.index') }}" class="btn btn--secondary">Cancel</a>
      <button type="submit" id="activity-next-button" class="btn btn--primary" disabled>Next &rarr;</button>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/live-activity-create.js') }}"></script>
{% endblock %}
